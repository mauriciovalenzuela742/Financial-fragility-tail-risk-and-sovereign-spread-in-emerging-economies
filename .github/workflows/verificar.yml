name: Verificar cifras canónicas

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas==2.3.3
      - run: python 1_Codigo/Panel/verificar_canonicos.py
